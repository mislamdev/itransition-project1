# Database configuration.
#
# PostgreSQL is the primary database (it gives us a native full text search
# implementation through tsvector/GIN indexes).  SQLite is supported as a
# portable fallback: export DB_ADAPTER=sqlite3 before running the app and the
# very same migrations are used.
#
# A DATABASE_URL always wins over this file, which makes deployments simple:
#   DATABASE_URL=postgres://user:password@host/database bin/rails server
#
<% if ENV["DB_ADAPTER"].to_s == "sqlite3" %>
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  <<: *default
  database: storage/production.sqlite3
<% else %>
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 } %>
  username: <%= ENV.fetch("DATABASE_USER") { "mislam" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { nil } %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "inventory_management_development" } %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("TEST_DATABASE_NAME") { "inventory_management_test" } %>

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "inventory_management_production" } %>
<% end %>
