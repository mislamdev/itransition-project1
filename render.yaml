# Render Blueprint for Stockroom.
#
# The blueprint creates the web service (from the Dockerfile of the
# repository) and the PostgreSQL database in one step:
#
#   1. Push this file to the repository.
#   2. In the Render dashboard: New -> Blueprint -> select the repository.
#   3. Render asks for the values that are marked with "sync: false".
#
# The database and the web service have to be in the same region.

services:
  - type: web
    name: stockroom
    runtime: docker
    plan: free
    branch: main

    # The image of the repository: the gems and the assets are compiled
    # while it is built, the entry point prepares the database and starts
    # Puma on 0.0.0.0:$PORT.
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # The application answers on /up with 200 as soon as it is booted.
    healthCheckPath: /up

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stockroom-db
          property: connectionString

      # The secret key base signs the session cookies. It has to stay the
      # same over the deployments, so it is not generated for every deploy.
      - key: SECRET_KEY_BASE
        sync: false

      - key: RAILS_LOG_LEVEL
        value: info

      # Render terminates TLS and forwards the request with
      # "X-Forwarded-Proto: https".
      - key: ASSUME_SSL
        value: "true"
      - key: FORCE_SSL
        value: "true"

      # The public name of the application. The .onrender.com address works
      # out of the box, a custom domain needs its own value.
      - key: APP_HOST
        sync: false
      - key: APP_HOSTS
        sync: false

      # The first administrator of the empty database. The entry point of
      # the container creates the account when it starts. An account that
      # exists already is only promoted, its password is never changed.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # The sign in with Google and Facebook is only enabled when both
      # values of a pair are present.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false

databases:
  - name: stockroom-db
    plan: free
